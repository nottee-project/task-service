services:
  app:
    build:
      context: ..
      dockerfile: docker/dockerfile
    container_name: go-task-service
    env_file:
      - ../.env
    depends_on:
      - db
    networks:
      - app-network
    ports:
      - "44044:44044"

    volumes:
      - .:/app
      - air-config:/root/.air

  db:
    image: postgres:14-alpine
    container_name: task-db
    env_file:
      - ../.env
    # environment:
    #   POSTGRES_USER: ${POSTGRES_USER}
    #   POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    #   POSTGRES_DB: ${POSTGRES_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network
    ports:
      - "5432:5432"

networks:
  app-network:
    driver: bridge

volumes:
  air-config:
  pgdata:


